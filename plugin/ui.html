<html>
<body style="margin:0;font:11px -apple-system,sans-serif;background:#1e1e1e;color:#eee;display:flex;align-items:center;height:100vh;">
<div id="status" style="padding:0 12px;opacity:.8;">connecting&hellip;</div>
<script>
  const RELAY_URL = "ws://localhost:4395/plugin";
  const MAX_BACKOFF_MS = 10_000;

  let ws = null;
  let backoff = 500;

  const status = document.getElementById("status");
  function setStatus(text, color) {
    status.textContent = text;
    status.style.color = color;
  }

  function connect() {
    try {
      ws = new WebSocket(RELAY_URL);
    } catch (err) {
      setStatus("blocked: " + err.message, "#f66");
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      backoff = 500;
      setStatus("connected", "#6f6");
    };

    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }
      if (typeof msg.id !== "number" || typeof msg.method !== "string") return;
      parent.postMessage(
        {
          pluginMessage: {
            source: "figma-bridge",
            type: "request",
            id: msg.id,
            method: msg.method,
            params: msg.params ?? {},
          },
        },
        "*"
      );
    };

    ws.onclose = () => {
      ws = null;
      setStatus("relay unreachable, retrying\u2026", "#f96");
      scheduleReconnect();
    };

    ws.onerror = () => {
      try {
        ws.close();
      } catch {}
    };
  }

  function scheduleReconnect() {
    const wait = backoff;
    backoff = Math.min(backoff * 2, MAX_BACKOFF_MS);
    setTimeout(connect, wait);
  }

  window.onmessage = (event) => {
    const d = event.data && event.data.pluginMessage;
    if (!d || d.source !== "figma-bridge" || d.type !== "response") return;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ id: d.id, ok: d.ok, result: d.result, error: d.error }));
    }
  };

  connect();
</script>
</body>
</html>
